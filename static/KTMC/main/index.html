<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<link rel="stylesheet" href="style.css">
	<link rel="stylesheet" href="../_shared/common.css">
	<script src="../_shared/deps/reconnecting-websocket.min.js"></script>
	<script src="../_shared/deps/countUp.js"></script> 
	<script src="../_shared/deps/jquery.min.js"></script>
	<script src="../_shared/utils.js"></script>
</head>

<body>
	<div class="main">

		<div class="overlay"></div>
		<div id="map_background" class="map-background"></div>

		<div class="header">
			<div class="header-team red">
				<div class="team-text red">
					<div class="team-border red">
						<div class="team-flag" id="red_flag"></div>
						<div class="team-seed" id="red_seed">SEED X</div>
					</div>
					<div class="team-name">
							<div class="team-name-text" id="red_name"></div>
							<div class="team-points red" id="red_points"></div>
					</div>
				</div>
			</div>
			<div class="header-middle">
				<div class="header-logo"></div>
				<div class="stage-name" id="stage_name">X</div>
			</div>
			<div class="header-team blue">
				<div class="team-text blue">
					<div class="team-name">
						<div class="team-name-text" id="blue_name"></div>
						<div class="team-points blue" id="blue_points"></div>
				</div>
					<div class="team-border blue">
						<div class="team-flag" id="blue_flag"></div>
						<div class="team-seed" id="blue_seed">SEED X</div>
					</div>
					
				</div>
			</div>
		</div>

		<div class="gameplay-area"></div>

		<div class="footer">
			<div class="top-footer" id="top_footer">
				<div class="lead-bar" id="lead_bar"></div>
				<div class="team-scores">
						<div class="team-score red" id="score_red">0</div>
						<div class="team-score blue" id="score_blue">0</div>
				</div>
				<div class="score-diff-container">
						<div class="score-diff" id="score_diff" data-before="" data-after="">0</div>
				</div>
			</div>
			<div class="bottom-footer">
				<div class="map-stats-container">
					<div class="map-slot-container" id="map_slot_container">
						<div class="picked-by" id="picked_by"></div>
						<div class="map-slot" id="map_slot"></div>
					</div>
					<div class="map-stats">
						<div class="map-song-preview" id="map_song_background"></div>
						<div class="map-stats-title">
							<div class="map-stats-title__item title-top">
								<span id="artist"></span> - <span id="title"></span>
								[<span id="difficulty"></span>]
								<div class="map-stats-title__item title-bottom">
									Mapped by <span id="mapper"></span>
								</div>
							</div>
							<div class="map-stats-attributes">
								<div class="map-stats-attributes__item"><span>CS</span><span id="cs"
										class="map-stats-attributes__item-value"></span></div>
								<div class="map-stats-attributes__item"><span>AR</span><span id="ar"
										class="map-stats-attributes__item-value"></span></div>
								<div class="map-stats-attributes__item"><span>OD</span><span id="od"
										class="map-stats-attributes__item-value"></span></div>
								<div class="map-stats-attributes__item"><span>BPM</span><span id="bpm"
										class="map-stats-attributes__item-value"></span></div>
								<div class="map-stats-attributes__item"><span>LENGTH</span><span id="length"
										class="map-stats-attributes__item-value"></span></div>
								<div class="map-stats-attributes__item"><span>SR</span><span id="sr"
										class="map-stats-attributes__item-value"></span></div>
							</div>
						</div>
					</div>
				</div>
	
				<div class="chat-container" id="chat_container">
					<div class="chat" id="chat"></div>
				</div>
			</div>
			
		</div>
			<div class="logo"></div>
		</div>

		<div class="add_block">
			<div class="add_block1">
				<label for="datetime" class="add_label2">Отмена действия:</label>
				<button id="undo-button" class="add_button">Галя отмена!</button>
			</div>
			</div>
				
		</div>
	</div>
	
	<script src="index.js"></script>
</body>

</html>
